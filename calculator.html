git --version<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AB CALC+</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: system-ui, sans-serif;
        background: #f3f5f8;
        color: #182230;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 1rem;
        box-sizing: border-box;
      }

      .calculator {
        width: min(100%, 22rem);
        padding: 1.25rem;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 2.5rem #1822301a;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.25rem;
      }

      .display {
        min-height: 4.5rem;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        overflow-wrap: anywhere;
        margin-bottom: 0.5rem;
        padding: 0.75rem;
        border-radius: 0.6rem;
        background: #f3f5f8;
        font-size: 2rem;
        font-variant-numeric: tabular-nums;
      }

      .status {
        min-height: 1.5rem;
        margin: 0 0 0.75rem;
        color: #526174;
        font-size: 0.85rem;
      }

      .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.55rem;
      }

      button {
        min-height: 3.25rem;
        border: 0;
        border-radius: 0.55rem;
        background: #e9edf3;
        color: inherit;
        font: inherit;
        font-size: 1.1rem;
        cursor: pointer;
      }

      button:hover {
        background: #dce3ed;
      }

      button:focus-visible {
        outline: 3px solid #3478f6;
        outline-offset: 2px;
      }

      button.operator {
        background: #e4edff;
        color: #174ea6;
      }

      button.equals {
        background: #2463eb;
        color: white;
      }

      button.wide {
        grid-column: span 2;
      }
    </style>
    <script src="./Calulator.js" defer></script>
    <script src="./calculator-browser.js" defer></script>
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <h1>ABCALC+</h1>
      <output class="display" id="display" aria-live="polite">0</output>
      <p class="status" id="status" aria-live="polite"></p>
      <div class="keys" id="keys">
        <button type="button" data-action="clear">AC</button>
        <button type="button" data-action="sign">+/-</button>
        <button type="button" data-action="unary" data-method="reciprocal">1/x</button>
        <button type="button" class="operator" data-action="operator" data-method="divide">÷</button>

        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="operator" data-action="operator" data-method="multiply">×</button>

        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" class="operator" data-action="operator" data-method="subtract">−</button>

        <button type="button" data-digit="100">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" class="operator" data-action="operator" data-method="add">+</button>

        <button type="button" class="operator" data-action="operator" data-method="power">xʸ</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" data-action="decimal">.</button>
        <button type="button" data-action="unary" data-method="sqrt">√</button>
        <button type="button" class="equals wide" data-action="equals">=</button>
      </div>
    </main>
  </body>
</html>
